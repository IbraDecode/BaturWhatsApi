name: CI

on:
  push:
    branches: [main, develop, BATURWHATSAPI]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'
      - name: fmt
        run: test -z "$(gofmt -l . | grep -v '^$')"
      - name: vet
        run: go vet ./...
      - name: test
        run: go test ./... -count=1 -timeout 10m
      - name: race
        run: go test ./... -count=1 -race -timeout 20m

  cross-build:
    needs: test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: arm64
    env:
      CGO_ENABLED: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'
      - name: build
        run: |
          GOOS=${{ matrix.goos }} GOARCH=${{ matrix.goarch }} \
          go build -trimpath -o batur-${{ matrix.goos }}-${{ matrix.goarch }} ./cmd/batur

  bench:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'
      - name: micro-bench
        run: go run ./cmd/batur bench

  fuzz:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'
      - name: codec fuzz (5s/target)
        run: |
          go test -run '^$' -fuzz=FuzzDecodeDefault -fuzztime=5s ./protocol/binary/
          go test -run '^$' -fuzz=FuzzEncodeNode   -fuzztime=5s ./protocol/binary/
          go test -run '^$' -fuzz=FuzzParse        -fuzztime=5s ./protocol/pb/

  storage-adapters:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'
      - name: sibling module build + test
        working-directory: storage-adapters
        run: |
          go build ./...
          go test ./...
